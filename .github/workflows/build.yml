name: Build

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            app_version:
                description: "应用内版本号（如 2.1.4.2），留空则用上游版本+提交hash"
                required: false
                default: ""
                type: string

            build_ios:
                description: "Build iOS"
                required: false
                default: false
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: false
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: false
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: false
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: github.event_name == 'workflow_dispatch'
              run: |
                  if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android "${{ github.event.inputs.app_version }}"

            # Maven Central 对部分大体积 Kotlin 构件会 302 到 GitHub release，
            # 该资源偶发 504，导致 :gradle:compileKotlin 直接失败。
            # 先从镜像按内容哈希预热 Gradle 缓存，Gradle 校验 .sha1 后即可命中，不再下载。
            - name: Prewarm kotlin compiler cache
              run: |
                  set -eu
                  VER=2.3.20
                  ART=org.jetbrains.kotlin/kotlin-compiler-embeddable/$VER/kotlin-compiler-embeddable-$VER.jar
                  CACHE="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-compiler-embeddable/$VER"
                  if [ -n "$(find "$CACHE" -name '*.jar' 2>/dev/null)" ]; then
                    echo "already cached"; exit 0
                  fi
                  for BASE in https://maven.aliyun.com/repository/central https://repo.maven.apache.org/maven2; do
                    if curl -fsSL --retry 3 --retry-delay 2 --max-time 300 -o /tmp/kc.jar "$BASE/$ART"; then
                      SHA=$(sha1sum /tmp/kc.jar | cut -d' ' -f1)
                      mkdir -p "$CACHE/$SHA"
                      cp /tmp/kc.jar "$CACHE/$SHA/kotlin-compiler-embeddable-$VER.jar"
                      echo "seeded $SHA"; exit 0
                    fi
                  done
                  echo "prewarm failed, let gradle try by itself"; exit 0

            # media_kit 在 configure 阶段从 GitHub release 下载 libmpv jar，
            # 该通道大文件偶发 504/超时，且 downloadDependencies 不做重试，整条构建直接失败。
            # 按 build.gradle 里固定的 sha256 预置到 build 目录，命中后它会跳过下载。
            # 这时 patch.ps1 已经跑过 flutter pub get，pub-cache 里能定位到 media-kit。
            - name: Prewarm media_kit libmpv jars
              run: |
                  MK=$(find "$HOME/.pub-cache/git" -maxdepth 1 -type d -name 'media-kit-*' 2>/dev/null | head -1)
                  if [ -z "$MK" ]; then echo "::warning::media-kit not found in pub-cache, skip"; exit 0; fi
                  DEST="$MK/libs/android/media_kit_libs_android_video/android/build/20260906"
                  mkdir -p "$DEST"
                  seed() {
                    name="$1"; want="$2"
                    if [ -f "$DEST/$name" ] && [ "$(sha256sum "$DEST/$name" | cut -d' ' -f1)" = "$want" ]; then
                      echo "ok $name"; return 0
                    fi
                    for prefix in https://gh-proxy.com/ https://ghproxy.net/ https://ghfast.top/ ""; do
                      url="${prefix}https://github.com/My-Responsitories/libmpv-android-video-build/releases/download/20260906/$name"
                      if curl -fsSL --retry 2 --retry-delay 3 --max-time 600 -o "$DEST/$name.part" "$url"; then
                        got=$(sha256sum "$DEST/$name.part" | cut -d' ' -f1)
                        if [ "$got" = "$want" ]; then
                          mv "$DEST/$name.part" "$DEST/$name"; echo "seeded $name"; return 0
                        fi
                        echo "sha256 mismatch from '${prefix:-direct}' (got $got)"; rm -f "$DEST/$name.part"
                      fi
                    done
                    return 1
                  }
                  miss=0
                  seed default-arm64-v8a.jar   98df6410375cc7a4be7e6eff56f9ccd88fa52678973cc23bcf7e934ab8c8682d || miss=1
                  seed default-armeabi-v7a.jar 75ba2199848cd6224817320ddfabb7d7ea48fb4cfb1721b0090043d5a8a38602 || miss=1
                  seed default-x86_64.jar      1caa6198de22808bd7f10fcff2923f5eb174cc42ef24569aeafb98c6597457a4 || miss=1
                  if [ "$miss" != "0" ]; then
                    echo "::warning::some libmpv jars not prewarmed, fallback to gradle download"
                  fi
                  exit 0

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --build-name="${{ env.BUILD_NAME }}" --build-number="${{ env.BUILD_NUMBER }}" --no-pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --no-pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliNova_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: PiliNova_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliNova_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliNova_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: PiliNova_android_*_x86_64.apk

    ios:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: ${{ github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: ${{ (github.event_name == 'pull_request' && github.repository == 'bggRGjQaUbCoE/PiliPlus') || github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions: write-all
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
